<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ ವಿಶೇಷ | ಪ್ರಜಾವಾಣಿ</title>
  <meta name="description" content="ಪ್ರಜಾವಾಣಿ ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ ವಿಶೇಷ – ನಾಡು, ನುಡಿ, ಕಲೆ ಮತ್ತು ಪರಂಪರೆಯ ಕಥನಗಳು.">
  <meta name="theme-color" content="#A80F22">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/PvHeadlineSemibold3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/PrajavaniTextRegular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="top">
  <a class="skip-link" href="#main" data-text="skipLink"></a>

  <div class="top-strip">
    <div class="container top-strip__inner">
      <span data-text="topStrip"></span>
      <span class="top-strip__date" data-text="topStripDate"></span>
    </div>
  </div>

  <header class="masthead">
    <div class="container masthead__inner">
      <h1 class="brand">
        <a class="brand__link" href="#top">
          <img class="brand__logo" src="assets/logo/pv-logo.png" alt="ಪ್ರಜಾವಾಣಿ" width="248" height="63">
          <span class="brand__divider" aria-hidden="true"></span>
          <img class="brand__event-art" src="assets/hero/karunadotsava-art-160.webp" alt="" width="160" height="150">
          <span class="brand__event-title" data-text="eventTitle"></span>
        </a>
      </h1>
      <div class="search">
        <button class="icon-button search__toggle" type="button" aria-expanded="false" aria-controls="search-form" data-label="searchOpen">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <form class="search__form" id="search-form" role="search">
          <label class="visually-hidden" for="search-input" data-text="searchLabel"></label>
          <div class="search__field">
            <svg class="icon search__icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input class="search__input" id="search-input" type="search" autocomplete="off" data-placeholder="searchPlaceholder">
          </div>
          <div class="search__results" id="search-results" hidden>
            <p class="search__status" id="search-status" aria-live="polite"></p>
            <ul class="search__list" id="search-list"></ul>
          </div>
        </form>
      </div>
      <a class="button button--outline masthead__action" data-text="headerAction" data-href="headerActionUrl"></a>
    </div>
  </header>

  <nav class="site-nav" data-label="navLabel">
    <div class="container site-nav__inner">
      <ul class="site-nav__list" id="nav-list"></ul>
      <button class="site-nav__more" type="button" aria-haspopup="dialog" aria-controls="menu-panel">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span data-text="menuButton"></span>
      </button>
    </div>
  </nav>

  <dialog class="menu-panel" id="menu-panel" aria-labelledby="menu-panel-title">
    <div class="menu-panel__inner">
      <div class="menu-panel__header">
        <h2 class="menu-panel__title" id="menu-panel-title" data-text="menuTitle"></h2>
        <button class="icon-button menu-panel__close" type="button" data-label="menuClose">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul class="menu-panel__list" id="menu-panel-list"></ul>
    </div>
  </dialog>

  <dialog class="lightbox" id="lightbox" data-label="lightboxLabel">
    <div class="lightbox__inner">
      <div class="lightbox__bar">
        <span class="lightbox__count" id="lightbox-count"></span>
        <button class="round-button lightbox__close" type="button" data-label="lightboxClose">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <figure class="lightbox__figure">
        <img class="lightbox__img" id="lightbox-img" alt="">
        <figcaption class="lightbox__caption">
          <span id="lightbox-caption"></span>
          <span class="byline" id="lightbox-credit"></span>
        </figcaption>
      </figure>
      <button class="round-button lightbox__arrow lightbox__arrow--prev" type="button" data-step="-1" data-label="lightboxPrev">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="round-button lightbox__arrow lightbox__arrow--next" type="button" data-step="1" data-label="lightboxNext">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </dialog>

  <main id="main">
    <section class="featured" aria-labelledby="featured-title">
      <div class="container">
        <h2 class="section-title" id="featured-title" data-text="featuredTitle"></h2>
        <div class="carousel" aria-roledescription="carousel" aria-labelledby="featured-title">
          <div class="carousel__stage">
            <ul class="carousel__track" id="carousel-track"></ul>
            <button class="round-button carousel__arrow carousel__arrow--prev" type="button" data-step="-1" data-label="carouselPrev">
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="round-button carousel__arrow carousel__arrow--next" type="button" data-step="1" data-label="carouselNext">
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <p class="carousel__caption" id="carousel-caption"></p>
          <div class="carousel__controls">
            <div class="carousel__dots" id="carousel-dots"></div>
            <button class="round-button carousel__toggle" type="button">
              <svg class="icon icon--pause" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
              <svg class="icon icon--play" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="intro">
      <div class="container intro__inner">
        <blockquote class="intro__quote">
          <p data-text="introQuote"></p>
          <footer data-text="introQuoteBy"></footer>
        </blockquote>
        <div class="intro__body">
          <p data-text="introText"></p>
          <a class="button button--accent" href="#sections" data-text="introAction"></a>
        </div>
      </div>
    </section>

    <section class="poster" id="poster" aria-labelledby="poster-title">
      <div class="container poster__inner">
        <div class="poster__intro">
          <p class="tag" data-text="posterEyebrow"></p>
          <h2 class="poster__title" id="poster-title" data-text="posterTitle"></h2>
          <p class="poster__lead" data-text="posterLead"></p>
          <p class="poster__privacy">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <span data-text="posterPrivacy"></span>
          </p>
        </div>

        <ol class="poster__steps">
          <li class="poster__step">
            <fieldset class="poster__fieldset">
              <legend class="poster__step-title" data-text="posterStepType"></legend>
              <div class="choice-group" id="poster-types"></div>
            </fieldset>
          </li>
          <li class="poster__step">
            <p class="poster__step-title" data-text="posterStepPhoto"></p>
            <div class="poster__buttons">
              <button class="button button--primary" id="poster-camera" type="button">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                <span data-text="posterTakePhoto"></span>
              </button>
              <label class="button button--outline">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>
                <span data-text="posterChoosePhoto"></span>
                <input class="visually-hidden" id="poster-file" type="file" accept="image/*">
              </label>
              <input class="visually-hidden" id="poster-capture" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
            </div>
            <p class="poster__tip" id="poster-tip"></p>
          </li>
          <li class="poster__step">
            <label class="poster__step-title" for="poster-name" id="poster-name-label"></label>
            <input class="poster__input" id="poster-name" type="text" maxlength="40" autocomplete="off">
          </li>
          <li class="poster__step">
            <label class="poster__step-title" for="poster-zoom" data-text="posterZoom"></label>
            <input class="poster__range" id="poster-zoom" type="range" min="1" max="3" step="0.01" value="1" disabled>
          </li>
        </ol>

        <figure class="poster__preview">
          <canvas class="poster__canvas" id="poster-canvas" width="1080" height="1350" tabindex="0" role="img"></canvas>
          <figcaption class="poster__hint" data-text="posterHint"></figcaption>
        </figure>

        <div class="poster__actions">
          <button class="button button--primary" id="poster-download" type="button" disabled>
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            <span data-text="posterDownload"></span>
          </button>
          <button class="button button--outline" id="poster-share" type="button" disabled>
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>
            <span data-text="posterShare"></span>
          </button>
          <p class="poster__status" id="poster-status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="highlights" aria-labelledby="highlights-title">
      <div class="container">
        <h2 class="section-title" id="highlights-title" data-text="highlightsTitle"></h2>
        <ul class="card-grid" id="highlights-list"></ul>
      </div>
    </section>

    <section class="videos" id="videos" aria-labelledby="videos-title">
      <div class="container">
        <h2 class="section-title" id="videos-title" data-text="videosTitle"></h2>
        <div class="video-gallery">
          <div class="video-player">
            <div class="video-player__frame">
              <video class="video-player__video" id="video-player" controls playsinline preload="none"></video>
            </div>
            <div class="video-player__info">
              <span class="tag" id="video-tag"></span>
              <h3 class="video-player__title" id="video-title"></h3>
              <p class="video-player__summary" id="video-summary"></p>
              <p class="byline" id="video-credit"></p>
            </div>
          </div>
          <ul class="video-list" id="video-list"></ul>
        </div>
      </div>
    </section>

    <section class="gallery" id="gallery" aria-labelledby="gallery-title">
      <div class="container">
        <h2 class="section-title" id="gallery-title" data-text="galleryTitle"></h2>
        <ul class="gallery__grid" id="gallery-list"></ul>
      </div>
    </section>

    <section class="directory" id="sections" aria-labelledby="sections-title">
      <div class="container">
        <h2 class="section-title" id="sections-title" data-text="sectionsTitle"></h2>
        <ol class="directory__grid" id="directory-list"></ol>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="flag-bar" aria-hidden="true"></div>
    <div class="container site-footer__inner">
      <div class="site-footer__brand">
        <span class="site-footer__logo">
          <img src="assets/logo/pv-logo.png" alt="ಪ್ರಜಾವಾಣಿ" width="248" height="63" loading="lazy">
        </span>
        <p data-text="footerAbout"></p>
      </div>
      <nav class="site-footer__nav" aria-labelledby="footer-sections-title">
        <h2 class="site-footer__heading" id="footer-sections-title" data-text="footerSectionsTitle"></h2>
        <ul class="site-footer__links" id="footer-links"></ul>
      </nav>
      <details class="site-footer__credits">
        <summary data-text="footerCreditsTitle"></summary>
        <ul id="credits-list"></ul>
      </details>
    </div>
    <div class="site-footer__bottom">
      <div class="container site-footer__bottom-inner">
        <span data-text="footerCopyright"></span>
        <span data-text="footerDraftNote"></span>
      </div>
    </div>
  </footer>

  <a class="poster-cta" href="#poster" hidden>
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span data-text="posterCta"></span>
  </a>

  <dialog class="camera" id="camera" aria-labelledby="camera-title">
    <div class="camera__inner">
      <h2 class="visually-hidden" id="camera-title" data-text="cameraTitle"></h2>
      <video class="camera__video" id="camera-video" playsinline muted></video>
      <div class="camera__controls">
        <button class="round-button camera__close" type="button" data-label="cameraClose">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="camera__shutter" type="button" data-label="cameraShutter"></button>
      </div>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/poster.js"></script>
</body>
</html>
